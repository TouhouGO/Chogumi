name: 功能建议
description: 想要的新功能或改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        先在 [已有 issue](https://github.com/TouhouGO/Chogumi/issues?q=is%3Aissue) 里搜一下，有同样的建议就在下面补充。
  - type: textarea
    id: what
    attributes:
      label: 想要什么
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 什么时候会用到，现在是怎么做的
  - type: textarea
    id: media
    attributes:
      label: 截图或示意图
      description: 草图、截图或别处的类似做法，直接拖进来
