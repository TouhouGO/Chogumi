name: 问题反馈
description: 闪退、显示不对、功能用不了
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        先在 [已有 issue](https://github.com/TouhouGO/Chogumi/issues?q=is%3Aissue) 里搜一下，同样的问题在原 issue 下补充就行。安全漏洞请走私密报告。
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开…
        2. 点…
        3. 看到…
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
  - type: textarea
    id: media
    attributes:
      label: 截图或录屏
      description: 直接拖进来，注意遮住不想公开的内容
  - type: input
    id: version
    attributes:
      label: App 版本
      description: 设置 › 关于
      placeholder: 0.1.11
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: 设备
      description: Android 版本、机型、系统
      placeholder: Android 15，小米 14，HyperOS 2
    validations:
      required: true
  - type: dropdown
    id: login
    attributes:
      label: 登录方式
      options:
        - 账号密码
        - 浏览器授权
        - Access Token
        - 没有登录
  - type: textarea
    id: log
    attributes:
      label: 日志
      description: 闪退时可以用 `adb logcat -b crash -d` 取崩溃日志
      render: text
