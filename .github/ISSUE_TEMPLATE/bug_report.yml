name: 问题反馈
description: App 行为不对、闪退、显示错乱
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        谢谢反馈。先在 [已有 issue](https://github.com/TouhouGO/Chogumi/issues?q=is%3Aissue) 里搜一下，同一个问题在原 issue 下补充就好。
        bgm.tv 网页上做同样的操作也出错，多半是服务端的事，请向 Bangumi 反馈；安全漏洞请走私密报告，不要写在这里。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交之前
      options:
        - label: 搜过已有 issue，没有同样的问题
          required: true
        - label: 在 [最新版本](https://github.com/TouhouGO/Chogumi/releases/latest) 上还能复现
          required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 从打开 App 开始，一步一步写到问题出现为止
      placeholder: |
        1. 打开某部作品的作品页
        2. 点…
        3. 看到…
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际看到什么
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望看到什么
    validations:
      required: true
  - type: textarea
    id: media
    attributes:
      label: 截图或录屏
      description: 直接拖进来。排版问题请附截图，动画或手势问题请附录屏；发之前遮住不想公开的内容
  - type: dropdown
    id: frequency
    attributes:
      label: 出现频率
      options:
        - 每次都会
        - 有时会
        - 只遇到过一次
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App 版本
      description: 设置 › 关于 里的版本号
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android 版本、机型与系统
      description: 厂商系统（HyperOS、ColorOS、One UI…）的行为常常不同，请一起写上
      placeholder: Android 15，小米 14，HyperOS 2
    validations:
      required: true
  - type: dropdown
    id: login
    attributes:
      label: 登录方式
      description: 取消收藏角色、解除好友、短信这些操作只有账号密码登录才能做
      options:
        - 账号密码
        - 浏览器授权
        - Access Token
        - 没有登录
    validations:
      required: true
  - type: dropdown
    id: web
    attributes:
      label: 网页端能复现吗
      description: 在 bgm.tv 网页上做同样的操作
      options:
        - 没试
        - 网页正常
        - 网页也有同样问题
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: 日志（可选）
      description: 闪退时，连着电脑可以用 `adb logcat -b crash -d` 取到崩溃日志，贴在这里
      render: text
