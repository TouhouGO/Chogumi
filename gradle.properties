# 应用版本（主.次.修订）：versionName 与 versionCode 都由它推出（app/build.gradle.kts）
chogumi.version=0.1.11

# Gradle 守护进程：从零整仓构建时各模块的打包同时进行，2 GB 堆配默认的 G1 会在打包时 OutOfMemoryError；
# 3 GB + ParallelGC（吞吐优先，Gradle 性能指南推荐）从零构建也够。源码按 UTF-8 读
org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC -Dfile.encoding=UTF-8
# 配置缓存：构建脚本与约定插件都按它的约束写（见 app/build.gradle.kts 的凭据校验）
org.gradle.configuration-cache=true
# 构建缓存：任务产出按输入存进 ~/.gradle/caches/build-cache-1，输入没变的任务直接取（本机各 worktree 共用一份）；
# 远端 CI 由 gradle/actions/setup-gradle 把它连同依赖一起存进 Actions 缓存（.github/actions/setup-build）
org.gradle.caching=true
